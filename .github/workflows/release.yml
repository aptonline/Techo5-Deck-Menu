name: Release TECHO5 Deck

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (for example, v0.1.4)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a version tag such as v0.1.4."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Build and verify universal app
        shell: bash
        run: |
          set -euo pipefail

          project='TECHO5 Deck.xcodeproj'
          if [[ ! -d "$project" ]]; then
            project="TECHO5 Deck/$project"
          fi
          if [[ ! -d "$project" ]]; then
            echo "::error::Commit the Xcode project and its source files before tagging."
            exit 1
          fi

          build_dir="$RUNNER_TEMP/techo5-build"
          xcodebuild -project "$project" -scheme 'TECHO5 Deck' \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$build_dir" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build

          app="$build_dir/Build/Products/Release/TECHO5 Deck.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG must match app version v$version in App.xcconfig."
            exit 1
          fi

          archs="$(lipo -archs "$app/Contents/MacOS/TECHO5 Deck")"
          if [[ " $archs " != *" arm64 "* || " $archs " != *" x86_64 "* ]]; then
            echo "::error::Expected a universal app, found: $archs"
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/TECHO5-Deck-$version-macOS-universal.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/TECHO5-Deck-${RELEASE_TAG#v}-macOS-universal.zip"
          gh release create "$RELEASE_TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
